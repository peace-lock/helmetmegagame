# Source of truth for #info's content, hand-edited then pushed with
# `npm run db:rebuild-info-channel` (db/scripts/sync/rebuild-info-channel.js).
#
# Unlike zones.yaml/roles.yaml, this is NOT an upsert — every run is a
# full destructive wipe of #info (every message, every thread) followed by
# a full rebuild from whatever is currently in this file. There's no
# player-generated content in #info worth preserving, so there's no diffing
# logic; the script always throws away what's live and reposts from here.
#
# - banner: optional path (relative to docs/) to an image posted as a bare
#   attachment, with no text, as the very first thing in #info — before the
#   threads are even created, so nothing can land above it.
# - main_message: the directory's intro/pitch copy, posted verbatim as the
#   first message(s) in #info. Discord markdown (bold, bullets) is
#   preserved as-is. The thread-link listing that follows it in the
#   actually-posted message is NOT written here — the script generates it
#   from `categories` below, because thread IDs only exist once threads are
#   created.
# - categories: ordered list of { name, intro, threads }. `name` is
#   optional — if omitted, that category's threads are listed with no bold
#   heading line above them in the directory message. When present, `name`
#   becomes a plain bold heading line (no colon, not italicized). `intro`
#   is optional text posted verbatim under that heading, in the directory
#   message itself — not its own thread. Today: an unnamed category (Rules,
#   Fates, Lore) followed by a "Gameplay" category (an intro paragraph,
#   then Moves, Roleplay, Resources, Tags as threads).
# - threads: ordered list of { title, body }, { title, generated }, or
#   { title, body, generated }. Each becomes its own standalone public
#   thread on #info, titled `title`. `body` (if present) is posted verbatim
#   as a static intro. `generated` (if present) is built at run time and
#   posted after `body` — its content has no hand-authored text here at
#   all, so it can never drift from its source. Either way the result is
#   batched automatically if it exceeds Discord's 2000-char limit. The only
#   generator right now is `generated: roles-intro` (used by the Fates
#   thread below), which reads docs/roles.yaml and lists every faction's
#   roles by name + intro text only (no description/tags/threats) — edit
#   roles.yaml, rerun `npm run db:rebuild-info-channel`, and the thread
#   updates itself. (The generator key stays `roles-intro` even though the
#   thread is titled "Fates" — the rename is presentation-only, the game
#   system's own term stays "roles" everywhere else.)

banner: assets/info-banner.png

main_message: |-
  Bascinet is a large-scale, rules-light story generator, 70% roleplay and 30% strategy. It’s intended to be serious, grim, heroic, and occasionally funny.

  The game runs for 30 real days. Once a day, you declare what your character did, making a Move. Based on dice and your character’s Tags, the GMs adjudicate the resulting consequences. Mechanics are handled on the companion web panel while the roleplay takes place on Discord. ‡

  Bascinet simultaneously plays out on several levels. Kings win wars and move big pieces around the map while commoners try to fulfill their day-to-day desires.

categories:
  - threads:
      - title: Rules
        body: |-
          ① **Basic** — You must be 18+.
          - Romance is allowed. You can hint at sexual content, but nothing overt (fade to black!).
          - There are no children in Ravenheart.
          - Mild bigotry is fine. SA and similar aren’t.

          ② **Atmosphere** — Everything serves the atmosphere.
          - Act somewhat like a Medieval European. Play out fear (unless you have the **Brave** tag). Ravenheart is your home, your life.
          - Insulting the Baron would mean death, plus having your family ostracized. Think carefully.

          ③ **Information** — To support information asymmetry, everything that happens IC stays IC, and OOC stays OOC.
          - Don’t discuss the game’s happenings OOC. Vague references are okay.
          - Don’t say who your character is or who you’re playing. People might figure it out eventually, but protect the mystery.
          - You are allowed to use vague OOC in roleplay channels when necessary — `(OOC: hey, gtg, see ya)` — instead of DM’ing the player.

          ④ **Antagonism** — Fulfill your character’s Desires, but not to the point of crossing your faction’s objectives.
          - High ranks are expected to be relatively fit for duty and willing to collaborate. Peasants can brawl and do mostly whatever they want.
          - If things naturally progress to where you betray your faction, that’s fine, but come into the game planning to do mostly good.
      - title: Fates
        body: |-
          Choose a fate at game start, determining your starting tags, faction, and location. Leader roles (★) are reserved for players who can vouch frequent and long-term availability, and some proficiency in roleplay. The Leader Whitelist role can be acquired in <#1540617683442208790>.

          Most fates have small limits, but **Bolded** ones have higher caps and are more generalized, allowing for more freedom of play.
        generated: roles-intro
      - title: Lore
        body: |-
          **Lore**

          Centuries of oppression, darkness, and humiliation. Humankind, windwhipped on the crags of the wet but barren Earth, were forced into the caves to live there like animals.

          Empires were built below the surface.

          Who brought this upon us? Who destroyed us? Was it ourselves or someone else, something greater?

          Fortunately, we have the Lifeweb now. We live on the surface. It was built a long time ago. Now it's the year of our Lord God, 1210. There are other places on this Earth, or perhaps in space, where people live happily. But we only know Ravenheart. Ravenheart is kept alive by the Lifeweb, which in turn is fed by the blood of Ravenheart's people. The Lifeweb protects Ravenheart from the stormy, windy wastelands outside, making it so people can breathe, farm, and build. Ravenheart is hospitable and enviable, but it's a fragile place, a glimmer of order in a sea of inscrutable darkness.

          **Is there magic?**
          Probably not.

          **Is there technology?**
          Sort of; the rich have electricity and the merchant has some very weird goods, but peasants are straight out of the 11th century.

          **Beliefs?**
          Most people are Post-Christian, but some people believe in the Old Ways.

          **Species?**
          Everyone's a human (?).
  - name: Gameplay
    intro: |-
      Bascinet has two layers: the Move layer (strategic) and the Roleplay layer (narrative). Moves are adjudicated once a day, and are where mechanical effects take place. The Roleplay layer is always going on, and takes the results of the Move layer as its canon. ‡
    threads:
      - title: Moves
        body: |-
          One turn is one real day, beginning at midnight US Central. Turns alternate between Dawn and Dusk, so an in-game day takes two of them. Every turn, you can optionally plan a Move that’ll take effect the next turn. ‡

          Moves are your abstracted intent of what you planned to do over the turn. Moves are reserved for lengthy, time-consuming, or difficult activities. ‡

          **Examples**:
          - robbing someone;
          - cooking several meals;
          - collecting taxes around the town;
          - going to the inn to fulfill a Desire.

          *You don’t have to Move every turn*. If it didn’t take more than an hour or wasn’t difficult, it’s not a Move. Bandaging people, trading, and talking are not Moves.

          Like Mafia, Moves are collectively adjudicated by the Gamemasters at the end of every turn. If the Baron’s move was to stay in his castle, then the Brigand’s move to rob him won’t succeed. If the Baron was wandering in the forest, the Brigand may very well get him.

          Adjudication results are messaged to players at the end of every turn.

          **Routine / Gambit**
          There are two types of Moves: **Routine** and **Gambit**.

          Routine moves have no chance to fail — their results are usually just accepted and canonized at turn end. Hunting, farming, going out for drinks, or smithing are all Routine.

          Gambit moves are actions that could affect the narrative and could go any way. Fighting, trying to discover a bandit outpost, and stealing from the Inn are all Gambits. Gambits require a 1d6 roll.

          **Group Moves**
          Unless they do something else or refuse to participate, a Leader can direct members of his faction (even AFK members) as part of his Moves. Their tags are considered during the adjudication. Only one Gambit die is rolled.
      - title: Roleplay
        body: |-
          The game’s roleplay layer is where the results of last turn’s Moves come to life. If the Gamemaster declared you were bested in a duel, that’s canon; you can describe how it went down in the roleplay channels. You can also use the roleplay channels at any time to chat, exchange information, or coordinate your Moves with other players.

          **Channels and Zones**
          There are three surface zones — the Fortress, the Town, and the Windlands — and three levels of the Caves: the Caverns, the Railroad, and the Aberrant Pits. Each is has their own Locations, and you stand in one of them at a time. Walking to a connected Location inside your Zone is free (with a short cooldown); crossing into another Zone costs your Move, the cave levels included.

          Every surface zone has a summary channel: optionally describe, in broad terms, what other people in your Zone saw you doing. ‡

          Every Location has its own channel. Talk in it, step into one of its public Rooms (the threads under it), or use the pinned message's buttons: **Who's here?**, **Secret rooms?** (the private Rooms your tags let you into), and **Converse** (start a private thread, use `/add (character)` to invite people).

          A cave level has Location channels of its own, just no summary.

          You cannot roleplay in DMs or outside of the server.

          **Formatting**
          Here’s the recommended way to write a post:
          - `"text"` for dialogue.
          - text for emotes or description.
          - `(text)` for out-of-character text.

          You can append `-#` before your OOC text to make it tiny and hidden, or even spoiler it with `||text||`.
      - title: Resources
        body: |-
          The game’s central currency are Resources (⬢), abstracting food, money, and other bulk goods.

          Players are responsible for producing, taxing, distributing, and trading Resources.

          Characters automatically consume 1 ⬢ a day — 2 if you have a Fast Metabolism. Come up short and you’ll go **Hungry**, netting you −1 to all rolls until the next time you eat. The penalty increases until you die at −6. ‡

          **Laboring**
          Labor is its own kind of Move, and it takes a skill — without a Laboring tag you produce nothing at all. Submit no Move and you’ll Labor automatically. ‡

          Past the two general tiers there are three specialisations — hunting, farming and fishing — and **where you stand decides what they pay**. Some ground is rich, some is barren, and what a place is worth shifts over the course of the game. Press **Labor?** in any location’s channel to see what it yields today. ‡

          Farming feeds Ravenheart, and as such it is taxed by the Baron in order to distribute food through the valley. ‡
      - title: Tags
        body: |-
          Tags represent your character’s health, items, traits, and skills.

          The main way to obtain new Tags is to spend tag points. Everyone starts with Tag Points, but gains more through the game as they fulfill Desires. However, you can also create, inflict, and remove tags throughout the game — such as by smithing a sword, poisoning someone, or treating a wound.

          **Desires**
          You can fulfill Desires to obtain more tag points. You claim one *after* you have done the thing, not before — so play your character, then come and collect.

          Desires must be difficult and personal to receive points. For the Baron, even a whole bottle of gin is hardly satisfactory; for the Commoner, one glass is enough. Something you arranged purely in order to claim a Desire does not count.
