# Source of truth for #info's content, hand-edited then pushed with
# `npm run db:rebuild-info-channel` (db/prisma/rebuild-info-channel.js).
#
# Unlike locations.yaml/roles.yaml, this is NOT an upsert — every run is a
# full destructive wipe of #info (every message, every thread) followed by
# a full rebuild from whatever is currently in this file. There's no
# player-generated content in #info worth preserving, so there's no diffing
# logic; the script always throws away what's live and reposts from here.
#
# - banner: optional path (relative to docs/) to an image posted as a bare
#   attachment, with no text, as the very first thing in #info — before the
#   threads are even created, so nothing can land above it.
# - main_message: the directory's intro/pitch/rules copy, posted verbatim
#   as the first message(s) in #info. Discord markdown (bold, bullets) is
#   preserved as-is. The category/thread-link listing that follows it in
#   the actually-posted message is NOT written here — the script generates
#   it from `categories` below, because thread IDs only exist once threads
#   are created.
# - categories: ordered list of { name, threads }. `name` becomes a bold
#   heading line in the directory message; `threads` under it become
#   clickable thread-mention links, in the order listed here.
# - threads: ordered list of { title, body }, { title, generated }, or
#   { title, body, generated }. Each becomes its own standalone public
#   thread on #info, titled `title`. `body` (if present) is posted verbatim
#   as a static intro. `generated` (if present) is built at run time and
#   posted after `body` — its content has no hand-authored text here at
#   all, so it can never drift from its source. Either way the result is
#   batched automatically if it exceeds Discord's 2000-char limit. The only
#   generator right now is `generated: roles-intro` (used by
#   Mechanics/Roles below), which reads docs/roles.yaml and lists every
#   faction's roles by name + intro text only (no description/tags/threats)
#   — edit roles.yaml, rerun `npm run db:rebuild-info-channel`, and the
#   thread updates itself.

banner: assets/info-banner.png

main_message: |-
  Bascinet is a large-scale, rules-light story generator, 70% roleplay and 30% strategy. It’s intended to be serious, grim, heroic, and occasionally funny.

  The game takes place over a 30 day period both in real life and in game. Twice a day, you declare what your character did, making a Move. Based on dice and your character’s Tags, the GMs adjudicate the resulting consequences. Mechanics are handled on the companion web panel while the roleplay takes place on Discord.

  Bascinet simultaneously plays out on several levels. Kings win wars and move big pieces around the map while commoners try to fulfill their day-to-day desires.

  ## Rules
  ① **Basic** — You must be 18+.
  - Romance is allowed. You can hint at sexual content, but nothing overt (fade to black!)
  - There are no children in Ravenheart.
  - Mild bigotry is fine. SA and similar aren’t.

  ② **Atmosphere** — Everything serves the atmosphere.
  - Act somewhat like a Medieval European. Play out fear (unless you have the Brave tag). Ravenheart is your home, your life.
  - Insulting the Baron would mean death, plus having your family ostracized. Think carefully.

  ③ **Information** — To support information asymmetry, everything that happens IC stays IC, and OOC stays OOC.
  - Don’t discuss the game’s happenings OOC. Vague references are okay.
  - Don’t say who your character is or who you’re playing. People might figure it out eventually, but protect the mystery.
  - You are allowed to use vague OOC in roleplay channels when necessary—“(OOC: hey, gtg, see ya)”—instead of DM’ing the player.

  ④ **Antagonism** — Fulfill your character’s Desires, but not to the point of crossing your faction’s objectives.
  - High ranks are expected to be relatively fit for duty and willing to collaborate. Peasants can brawl and do mostly whatever they want.
  - If things naturally progress to where you betray your faction, that’s fine, but come into the game planning to do mostly good.

categories:
  - name: Premise
    threads:
      - title: Lore
        body: |-
          **Lore**

          Centuries of oppression, darkness, and humiliation. Humankind, windwhipped on the crags of the wet but barren Earth, were forced into the caves to live there like animals.

          Empires were built below the surface.

          Who brought this upon us? Who destroyed us? Was it ourselves or someone else, something greater?

          Fortunately, we have the Lifeweb now. We live on the surface. It was built a long time ago. Now it's the year of our Lord God, 1210. There are other places on this Earth, or perhaps in space, where people live happily. But we only know Ravenheart. Ravenheart is kept alive by the Lifeweb, which in turn is fed by the blood of Ravenheart's people. The Lifeweb protects Ravenheart from the stormy, windy wastelands outside, making it so people can breathe, farm, and build. Ravenheart is hospitable and enviable, but it's a fragile place, a glimmer of order in a sea of inscrutable darkness.

          **Is there magic?**
          Probably not.

          **Is there technology?**
          Sort of; the rich have electricity and the merchant has some very weird goods, but peasants are straight out of the 11th century.

          **Beliefs?**
          Most people are Post-Christian, but some people believe in the Old Ways.

          **Species?**
          Everyone's a human (?).
  - name: Mechanics
    threads:
      - title: Moves
        body: |-
          **Moves**:

          * There are two turns a day—Dawn and Dusk. Once a turn, declare the most important thing your character did that turn in #moves.
          * Moves are **Routine** if they are predictable and have no chance of failure, **Gambit** if it could go any way.
             * **Routine** moves—such as spending the morning farming, brewing alcohol, or laying simple fortifications—are automatically approved.
             * **Gambit** moves—such as engaging in a duel, going to a party to try to be happy, or spying on a house—require a 1d6 roll and a GM adjudication. The GM adjudicates primarily on the Tags and the narrative (Is your character a good fighter? How many people are on your side? Are you sick or healthy?) but also factors in the dice roll as a matter of chance (a roll of 1 means things went way worse than expected; a roll of 6 means they went surprisingly good).
          * Moves are **Opposed** if they affect another player negatively. If a move is Opposed, the GMs wait to see what other players do.
          * Moves are optional; you don’t have to play all of the time. You can set a default Routine Move using the /default command, to be executed if you don’t act that day. Leaders can use the /default command on other people too.
          * Group actions are simple. Someone, usually the faction leader, assigns—by pinging or otherwise referencing—several people to one effort. Those people are assumed to participate unless they explicitly do their own thing. For Gambits, only the Leader has to roll.
      - title: Tags
        body: |-
          **Tags**:

          * Tags represent your character’s abilities, items, health, etc.
          * You can use Moves to try to obtain or remove Tags, such as by smithing a Zweihander or curing someone’s illness. You can transfer certain Tags (typically items) to any player.
          * You start with Tag Points but gain more throughout the game.
      - title: Desires
        body: |-
          **Desires**:

          * Characters obtain Tag Points by fulfilling Desires.
          * The more difficult and personal the Desire, the more Tag Points you earn.
          * Leader characters can set Desires aligned with their faction goals (such as conquering territory), but lower level characters are encouraged to find personally relevant Desires, ranging from having a nice meal to proving themselves in front of an audience.
      - title: Resources
        body: |-
          **Resources**:

          * The game’s central currency are Resources (⬢), abstracting food, money, and other bulk goods.
          * Anyone can produce Resources by spending a Routine Move on Hunting, Herding, Farming, or Fishing (the /hunt, /fish, /farm and /herd commands are the shortcut) but only people with the Laborer tag produce enough to feed people. Each one needs the right ground under you — and nothing at all can be produced in the Caves.
          * Resources can either be stored in your character or in your faction’s Silo.
          * Players (but especially faction Leaders and Treasurers) are responsible for organizing, taxing, distributing, and trading Resources.
          * Characters automatically consume 1 ⬢ a turn. If you have 0 ⬢ at the start of a turn, you’ll go Hungry, netting you -1 to all Rolls until the next time you eat.
      - title: Respawning
        body: |-
          **Respawning**:

          When you die, you can rejoin at any time—but you'll be Cursed, meaning you can only start as a Bum or Migrant and you'll suffer a -3 penalty to your starting points.

          To rejoin as any other role, wait until your body is buried or your name is engraved. It is the Church and Mortii's jobs to do so.
      - title: Roles
        body: |-
          Choose a role at game start, determining your starting tags, faction, and location. Leader roles (★) are reserved for players who can vouch frequent and long term availability, and some proficiency in roleplay. The Leader Whitelist role can be acquired in <#1539672933268459591>.

          Most roles have small limits, but **Bolded** roles have higher caps and are more generalized, allowing for more freedom of play.
        generated: roles-intro
  - name: Discord
    threads:
      - title: Channels
        body: |-
          **Channels**

          * You always have three roleplay channels available to you (plus some like the Radio if you have the relevant Tag) depending on the Location you’re in: the summary channel, the public channel, and the private channel.
          * Summary: Big picture play. Describe what other people would see your character doing throughout that turn. Make announcements.
          * Public: A forum channel for your public, moment-to-moment roleplay. Make a post for a certain location or meeting, have chats, argue.
          * Private: A thread channel for your private meetings. Create a private thread (Thread button on the top right) and ping other characters to plot in secret.
          * Your messages in roleplay channels are automatically sent as your character. To conceal your identity further, you can use the `/message` command in the Bascinet bot’s DMs or press the Speak button in #turns, so it doesn’t show your Discord username when typing.
          * Type `/conceal` to write as an Unknown Person instead.
      - title: Archive
        body: |-
          **Archive**

          * All messages are wiped from the channels on Dawn and sent to the Archive. You’ll get to see all of your writing on game end.
          * Forum topics marked with the Persistent tag (such as locations) remain, but their posts are also cleared.
          * Run `/persistent` inside a forum topic or a private thread to mark it that way yourself — it survives Dawn (though its messages are still cleared), and a private thread keeps everyone you've invited into it. Run it again to unmark.
          * You can react to a message with ⭐ to save it on your Notes tab on the web interface.
      - title: Reacts
        body: |-
          **Reacts**

          * React to a message in a roleplay channel for more options.
          * 🔍: view more information about a character, including their visible Tags.
          * ⭐: save the message to your Notes panel on the web interface.
          * ❌: delete your own message.
          * ✏️: edit your own message.
