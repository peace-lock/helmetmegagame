# Sole master for the Desire catalog (DesireTemplate). Same posture as
# docs/tags.yaml: hand-edited, upsert-by-slug, non-destructive — a slug that
# drops out of this file is never deleted, only hidden (a later sync marks
# it `retired: true` on the row instead). `families:` below is the fixed
# vocabulary every entry's `families` list draws from; nothing here writes
# to it dynamically.
#
# ENTRY FORMAT: `familyGroups:`, `families:` and `desires:` are maps keyed by
# the entry's own key/slug (`drink-alcohol:`, not `- slug: drink-alcohol`) —
# see docs/tags.yaml's header for why, and db/lib/yamlEntries.js.
#
# REQUIRES SEMANTICS: `requires.anyTags` / `requires.allTags` /
# `requires.anyRoles` / `requires.notTags` / `requires.notRoles` combine as
# AND ACROSS the lists, OR WITHIN each `any` one. `allTags` is the odd one:
# EVERY tag in it must be held (butcher-a-human wants Cruel and Butcher
# both). It is always AND and can never carry `combine: or` — the sync
# refuses that pairing. So `anyTags: [dancer]` + `anyRoles: [minstrel,
# courtier]` reads "holds Dancer, AND holds Minstrel or Courtier" — not
# "Dancer or Minstrel or Courtier". Omit a sub-key entirely rather than
# writing an empty list.
#
# The one opt-out is `requires.combine: or`, which joins anyTags with
# anyRoles using OR so either alone opens the Desire — used where the gating
# tag is PURCHASABLE and the AND would make buying it dead weight to anyone
# outside the role (Esoteric unlocked nothing for a non-Scholastic), or where
# a listed role can never hold the required tag anyway (chaplain on
# bury-a-body, sheriff on imprison-someone). Both lists must be non-empty;
# notTags/notRoles are never part of the OR. AND remains the default and the
# common case — the five Lifeweb feed-* entries and all five corrupt ones keep
# it deliberately (corrupt is visible: false and promises no unlocks, so it
# reads as a Cerberon tag rather than a broad purchase).
#
# TIER: one of 1, 2, 3, 4, 5, 7. Tier 6 is deliberately absent from the
# whitelist — don't invent it. Tier doubles as the default Tag Point award
# and the per-desire cooldown in turns; `cooldownTurns` overrides the latter
# only. Tier 7 is ONCE EVER — the
# sync defaults `oncePerLife: true` automatically for every tier-7 entry, so
# it is never written explicitly below. `oncePerLife` IS written by hand on
# a handful of sub-7 entries where repeating the thing is absurd on its
# face (a second first-ever Baron coronation, learning to read twice).
#
# COOLDOWN POLICY (2026-09-02 balance sweep). Two things make the bare tier a
# bad cooldown for a cheap goal:
#
#   1. The per-slot lock already shuts a slot for the turn a Desire ends AND
#      the next one, so the soonest anything can be re-fulfilled is 2 turns
#      later. `cooldownTurns: 1` and `2` therefore do NOTHING — they are
#      dominated by a gate that was going to fire anyway. 3 is the smallest
#      value that has any effect at all. Don't write 1 or 2.
#   2. A gate is not a throttle. `requires` decides WHO may take a goal, never
#      how often; a tag or role you hold permanently costs nothing on the
#      second repetition. What actually throttles a Desire is a per-attempt
#      COST — ⬢ spent, an item consumed, a risk run.
#
# So: a Desire you pay for every time (drink alcohol, buy jewelry, win 10 ⬢
# gambling, feed the poor, host an event) keeps the tier as its cooldown — the
# spend is the throttle and it needs no help. A Desire that costs nothing but
# another player's cooperation (a hug, a compliment, an argument, a kiss) is a
# free income tap, and takes the ladder instead:
#
#     tier 1 -> cooldownTurns: 5      0.20 points/turn
#     tier 2 -> cooldownTurns: 4      0.50 points/turn
#     tier 3 -> cooldownTurns: 3      1.00 points/turn
#
# Deliberately inverted, so the cheap goals are the SLOWEST to come back and
# aiming higher always pays better per turn. Anything above tier 3 is rare
# enough by nature to leave on the tier.
#
# ‡ marks text the Desires-rework planner wrote — a drafted name/description,
# an invented tier, or a resolved conflict — exactly like docs/tags.yaml's
# own ‡ convention (see that file's header and content-spec.md §0).
# User-dictated text carries no marker. `grep -rn "‡" docs/desires.yaml`
# finds every line the planner touched; deleting the glyph is sign-off.
#
# Every {tag:slug} reference below has been checked against docs/tags.yaml.

# familyGroups: the hue clusters the Desire picker's tab bar shows
# (web/app/components/DesireCatalog.js). Every family below names one via
# `group:`. The sync ignores both keys; only the web app reads them, at
# runtime, through db/lib/desireFamilies.js.
familyGroups:
  appetite:
    name: Appetite
  heart:
    name: Heart
  blood:
    name: Blood
  nerve:
    name: Nerve
  ambition:
    name: Ambition
  mind:
    name: Mind
  demoness:
    name: Demoness

# THE PALETTE — same rules as docs/taggroups.yaml, keep it:
#   * One hue per GROUP, so the picker reads by group at a glance: Appetite
#     amber, Heart rose, Blood red, Nerve green, Ambition teal, Mind blue,
#     and Demoness magenta (which matches its tag category in
#     taggroups.yaml).
#   * Families inside a group step by LIGHTNESS and SATURATION, never out of
#     the hue.
#   * `color` is drawn as the 3px left rule on a picker row (a .panel on
#     --surface) and the swatch in its sticky family header. Every value
#     clears 3:1 (WCAG 1.4.11) against --surface on BOTH dusk and dawn; the
#     tightest here, betrayal, measures 3.32. Check the numbers before adding.
families:
  alcohol:
    name: Alcohol
    group: appetite
    color: "#d9a545"
    # Drinking, drunkenness, and specific drinks.
  drugs:
    name: Drugs
    group: appetite
    color: "#c98f3e"
    # Recreational narcotics — taking, dealing, overdosing, first tastes.
  gambling:
    name: Gambling
    group: appetite
    color: "#e3b866"
    # Wagers and games of chance; winning at play.
  food:
    name: Food
    group: appetite
    color: "#ecc98a"
    # Meals, feasts, cooking, sweets, tea, eating anything at all.
  vanity:
    name: Vanity
    group: heart
    color: "#eab0c8"
    # Being admired, complimented, adorned, or unmistakably better-looking
    # than the room.
  violence:
    name: Violence
    group: blood
    color: "#e07868"
    # Deliberate physical harm — fights, brawls, duels, battles, killings.
  cruelty:
    name: Cruelty
    group: blood
    color: "#cf6a5c"
    # Suffering inflicted on someone who can't stop you: torture,
    # humiliation, beating the defenceless.
  bravery:
    name: Bravery
    group: nerve
    color: "#8fc07f"
    # Courage against real risk: saving lives, standing ground, monsters,
    # tournaments, overwhelming odds.
  romance:
    name: Romance
    group: heart
    color: "#e08aa0"
    # Kissing, lovers, courtship, seduction.
  social:
    name: Social
    group: heart
    color: "#d9a0b4"
    # Friendship, argument, hugs, insults, dancing, performing, being
    # listened to.
  wealth:
    name: Wealth
    group: ambition
    color: "#5fc2c2"
    # Acquiring, hoarding, and owning — ⬢ stockpiles, houses, manors, pets,
    # purchases.
  theft:
    name: Theft
    group: ambition
    color: "#78b8b0"
    # Taking what isn't yours: cons, stealing, fencing, rackets, bribes.
  status:
    name: Status
    group: ambition
    color: "#5ab3ce"
    # Rank, office, title, promotion, coronation, standing.
  faction-success:
    name: Faction Success
    group: ambition
    color: "#8cd0dc"
    # Your own side winning something.
  feud:
    name: Feud
    group: blood
    color: "#e89a8c"
    # The enemy clan or rival specifically losing, bleeding, or being
    # humiliated.
  faith:
    name: Faith
    group: mind
    color: "#86a6e6"
    # Worship, sermons, conversion, confession, a god's favour, heresy and
    # its punishment.
  esoterica:
    name: Esoterica
    group: mind
    color: "#9a93e0"
    # Spells, occult and forbidden knowledge, ancient artifacts and ruins.
  medical:
    name: Medical
    group: mind
    color: "#a8bde8"
    # Treating, curing, dissecting, installing, testing on.
  craft:
    name: Craft
    group: mind
    color: "#b9c8ee"
    # Making or displaying a learned skill — paintings, songs, literacy,
    # teaching, footwork.
  duty:
    name: Duty
    group: nerve
    color: "#7fb29a"
    # Orders carried out: assignments, arrests, executions, interrogations,
    # messages, the watch.
  betrayal:
    name: Betrayal
    group: blood
    color: "#b96b60"
    # Turning on your own — informing, defecting, sabotage from inside.
  scheming:
    name: Scheming
    group: ambition
    color: "#92c9c0"
    # Manipulation at one remove: plots, blackmail, framing, setting people
    # against each other.
  adventure:
    name: Adventure
    group: nerve
    color: "#a9cf8c"
    # Exploration and danger for its own sake — the Pits, the mountains,
    # the Windlands, climbing.
  mortality:
    name: Mortality
    group: mind
    color: "#9fa9c8"
    # Death and the near side of it: dying, returning, burial, the Lifeweb.
  charity:
    name: Charity
    group: heart
    color: "#f0c4d0"
    # Giving with nothing back — feeding the poor, hugs given, mercy,
    # treating strangers.
  demoness:
    name: Demoness
    group: demoness
    color: "#d98ad0"
    # Predation, domination, enslavement, terror.
  stupidity:
    name: Stupidity
    group: mind
    color: "#b6a98f"
    # The one family {tag:stupid} does not lock. It exists precisely so that
    # tag's `desires.locks` has something to except besides alcohol — a
    # character with no reachable Desire at all has been benched rather than
    # changed. Nothing but Squeeze puts anybody in it. ‡
  # Deliberate adjacencies (not bugs — see content-spec.md §1):
