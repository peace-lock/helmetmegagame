    name: Sepsis
    category: health
    group: health-infection
    description: "Your body is shutting down. You're not lucid."
    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 1
    expiresInto: [dying]
    removesInto: [recovering, drained]
    healable: true
    requirement:
      turnsCost: 1
      resourceCost: 8
      skills: [medical-expert]
      gambit: true

  dying:
    catalog: all
    name: Dying
    category: health
    group: health-infection
    description: "You're on death's door. You have one turn. Someone with the very best medicine and a lot of luck could pull you back before it closes, but don't count on it."
    pointCost: 0
