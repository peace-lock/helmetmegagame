    pointCost: 7
    purchasable: true
    purchasableAfterStart: true

  claws:
    catalog: secret
    name: Claws
    category: demoness
    group: demoness
    description: "You can put out a set of dangerous claws at will, even while keeping a human face."
    pointCost: 5
    visible: false
    purchasable: true
    purchasableAfterStart: true

  # This one is `visible`, so a bystander reads its NAME off the sheet — which
  # rules out the "(Demoness)" suffix the Seductive twin carries. It
  # also cannot simply be called Otherworldly Beauty: that name is taken by the
  # Flawless Skin tonic's effect half, and docs/documents.yaml grants documents
  # by tag NAME, so two rows sharing one would be a coin toss. Hence a third
  # name that gives nothing away.
  peerless-beauty:
    catalog: secret
    name: Peerless Beauty
    category: demoness
    group: demoness
    description: "You are the most beautiful woman in the world."
    pointCost: 2
    requiredTag: beautiful
    visible: true
    purchasable: true
    purchasableAfterStart: true

  # An Instant Camera can be handed to anyone. Purchasable at
  # start like every other item (TAGS.md §4a: items are never
  # purchasableAfterStart).
  #
  # Reusable: the 📸 reaction reads the film-holder's camera as a gate and
  # never spends it. `consumable` is the OTHER thing you can do with one —
  # point it at nothing and keep the print — and it deliberately carries no
  # consumesInto:, because db/lib/photoMint.js mints the row instead. Same
  # special-case shape a SEALED letter already has in consumeTagRequestImpl.
  instant-camera:
    catalog: all
    name: Instant Camera
    category: items
    group: items-gear
    description: "An instant camera. You can 📸 react a person's message to take a picture of them."
    pointCost: 2
    tradeable: true
    weight: 2
    stackable: true
    visible: true
    purchasable: true
    purchasableAfterStart: false
    removable: true
    consumable: true
    sellable: true
    sellablePrice: 14
    depotPrice: 32

