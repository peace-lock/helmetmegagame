    pointCost: 0
    visible: true
    purchasable: false
    purchasableAfterStart: false
    durationTurns: 3
    expiresInto:
      - oneOf: [infected, recovering]
    healable: true
    requirement:
      resourceCost: 2
      skills: [medical-basic]

  # --- The Godard Factory --------------------------------------------------
  # The marsh production chain: Godflesh comes out of the wet ground, refines
  # into Squeeze on the Factory floor, and gets crated for the Merchant. See
  # docs/systemdocs/FACTORY.md.
  godflesh:
    catalog: gm
    name: Godflesh
    category: items
    group: items-gear
    description: "A fibrous, pink substance harvested from the waterlogged marshes. It previously squirmed and tried to eat your hands off, but now it's dead. Labor at the Godard Factory to refine it. ‡"
    pointCost: 0
    tradeable: true
    weight: 28
    stackable: true
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    consumable: true
    consumesInto: [vomiting]

  squeeze:
    catalog: gm
    name: Squeeze
    category: items
    group: items-gear
    description: "A gelatinous pink substance. The machines made it into a cube. Do not eat."
    pointCost: 0
    tradeable: true
    weight: 20
    stackable: true
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    consumable: true
    consumesInto: [seizure]
    # Nothing in Ravenheart wants a cube. The Depot buys every one of them,
    # which is the whole reason the Factory exists — 8 cubes is a day's work
    # and pays about 2.2 times a good farming day. ‡
    sellable: true
    sellablePrice: 4

  # UNTRADEABLE on purpose, which is the only thing that actually pins it down:
  # `removable: false` blocks the Destroy menu and nothing else, so while this
  # was tradeable anyone holding a Factory Key could pick the crating bench up,
  # walk it into the Spillway, and delete the Factory's whole reason to exist —
  # there are exactly two in the world and neither is craftable. Untradeable
  # also means it carries no weight, which is right for a fixture: nobody is
  # hauling it anywhere. ‡
  packaging-equipment:
    catalog: gm
    name: Packaging Equipment
    category: items
    group: items-gear
    description: "Allows you to package things into crates. It is bolted down. ‡"
    pointCost: 0
    tradeable: false
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: false

  armored-gloves:
