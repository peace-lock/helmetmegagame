    category: items
    group: items-drink
    description: "Freebase alcohol. Not good for your vision."
    pointCost: 0
    tradeable: true
    weight: 2
    stackable: true
    visible: true
    purchasable: false
    purchasableAfterStart: false
    removable: true
    craftable: true
