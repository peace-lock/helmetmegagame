  # --- Armor -------------------------------------------------------------

  # ─── Dead Simple (1 pt / 3 ⬢ / 0 turns) ───
  # --- Headgear ----------------------------------------------------------
  # Split out of Armor because these decide what a character's FACE is, not
  # just what stops a blade. Anything with `concealsIdentity` replaces the
  # wearer's name and avatar for as long as it is EQUIPPED — see
  # docs/systemdocs/PROXYING.md §5 — and `concealSprite` names the image the
  # room sees instead, built by `npm run assets:helms --workspace=web`.
  #
  # `forcesConceal` is the difference between a hood and a sack: with it, the
  # wearer has no say and /conceal refuses in both directions.
  #
  # equipLayer runs 1 (against the skin) to 4 (outermost), and the OUTERMOST
  # equipped piece is the one whose sprite shows. Two things cannot share a
  # layer, which is what stops a character wearing three helmets at once.

