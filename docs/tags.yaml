  # read people is not something people should be able to read off you.
  empathetic:
    catalog: all
    name: Empathetic
    category: general
    group: general-social
    description: "You can use a Gambit to figure out a person's last fulfilled Desire — failure on 1–3, success on 4–6. You must have spoken to them for a while during that turn."
    pointCost: 9
    purchasable: true
    purchasableAfterStart: true

  # The counter, and the only rule inspectVision.js reads off the SUBJECT
  # rather than the viewer: it shuts the Desire field for the Demoness
