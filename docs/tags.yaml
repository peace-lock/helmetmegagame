  # --- Paperwork -----------------------------------------------------------
  #
  # See docs/systemdocs/PAPERWORK.md. Three kinds of thing live here: the blank
  # stock below, the wax stamps that seal a finished letter, and — at runtime —
  # every sheet anybody actually writes on, which is a minted Tag row and is
  # never in this file.
  #
  # A stamp is declared by `sealMark:`, its distinguishing line. The sync
  # composes the whole description around it, so the boilerplate is written
  # once and nothing can drift; authoring a `description:` beside a `sealMark:`
  # is an error rather than an override.

  # The cheapest thing the Depot sells, on purpose. Paper has to be something
  # a scribe buys by the ream without thinking about it, or nobody writes.
